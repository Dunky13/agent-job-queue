name: Refresh generated tap

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-generated-tap
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Dunky13/homebrew-agent-job-queue' && github.ref == 'refs/heads/tap'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate public installer and publish signed tap metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
        run: python refresh.py --publish
