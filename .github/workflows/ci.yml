name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pre-push PR-range and fail-closed behavior
        run: python3 -m unittest discover -s tests -p test_git_hooks.py -v
      - name: Check DCO and verified signatures
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-commits.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-repository "$GITHUB_REPOSITORY"

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: brew install actionlint shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: bash scripts/lint.sh

  macos-tests:
    name: macOS tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: brew install pueue caddy
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: python -m pip install --require-hashes -r remote/requirements.lock
      - name: Core unit tests
        run: python -m unittest discover -s tests -p test_agent_heavy.py -v
      - name: Agent instruction integration tests
        run: python -m unittest discover -s tests -p test_agent_integration.py -v
      - name: Isolated real-daemon acceptance tests
        run: python -m unittest discover -s tests -p test_integration.py -v
      - name: Real HTTPS and API tests
        run: python -m unittest discover -s remote/tests -p test_remote.py -v
      - name: Native regression tests
        run: bash scripts/test-native.sh

  web-tests:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --require-hashes -r remote/requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:browser

  installer:
    name: Universal installer
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build macOS 15+ universal installer app
        run: scripts/build-installer.sh
      - name: Generate immutable release manifest and Homebrew cask
        run: |
          python packaging/homebrew/render_cask.py \
            --archive "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" \
            --version "$(cat VERSION)" --tag "build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" \
            --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --output dist
      - name: Record Homebrew version used for packaging validation
        run: brew --version
      - name: Verify Homebrew manifest and actual automated installer artifact
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
        run: python -m unittest discover -s tests -p test_homebrew.py -v
      - name: Install daemon for isolated installer smoke test
        run: brew install pueue
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - name: Verify payload and first install / upgrade behavior
        run: scripts/test-installer.sh "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip"
      - name: Upload installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent-Job-Queue-Installer
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ci-required:
    name: ci-required
    needs: [commit-policy, lint, macos-tests, web-tests, installer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              sys.exit('Required jobs did not pass: ' + ', '.join(failed))
          print('All required validation jobs passed.')
          PY

  publish:
    name: Publish main installer
    needs: [ci-required, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Agent-Job-Queue-Installer
          path: dist
      - name: Publish immutable main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            trap 'rm -rf "$existing"' EXIT
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish > "$existing/release.json"
            for asset in dist/*; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "${asset##*/}" --dir "$existing"
            done
            python3 - "$existing" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          existing = Path(sys.argv[1])
          if json.loads((existing / 'release.json').read_text())['targetCommitish'] != sys.argv[2]:
              sys.exit('Existing immutable release has a different target commit')
          for asset in Path('dist').iterdir():
              with asset.open('rb') as handle:
                  expected = hashlib.file_digest(handle, 'sha256').hexdigest()
              with (existing / asset.name).open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              if actual != expected:
                  sys.exit('Existing immutable release differs: ' + asset.name)
          print('Existing release target and all assets match; no overwrite performed.')
          PY
          else
            notes=$(mktemp)
            trap 'rm -f "$notes"' EXIT
            printf '%s\n\n%s\n\n%s\n' \
              "Automated installer from validated main commit ${GITHUB_SHA}. Includes Apple Silicon and Intel executables plus checksum-pinned Homebrew metadata." \
              '**macOS approval required:** This build is ad hoc signed and is not notarized. Gatekeeper can block the installer or menu app; Homebrew does not change that.' \
              'After an opening attempt, use System Settings > Privacy & Security > Open Anyway for the named Agent Job Queue app, if offered. Keep Gatekeeper and quarantine enabled. See https://support.apple.com/102445 for Apple instructions.' > "$notes"
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Main build ${GITHUB_RUN_NUMBER}" --prerelease \
              --notes-file "$notes"
          fi
