name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify pre-push PR-range and fail-closed behavior
        run: go test -p 2 ./internal/tooling -run TestPrePush -v
      - name: Check DCO and verified signatures
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go run -p 2 ./cmd/queue-tool check-commits --base "$BASE_SHA" --head "$HEAD_SHA" --github-repository "$GITHUB_REPOSITORY"

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
      - run: brew install actionlint shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: npm ci
      - run: bash scripts/lint.sh

  vulnerability-check:
    name: Go vulnerability scan
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check CLI, HTTPS and release-tool dependencies
        run: go run -p 2 golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/agent-heavy ./cmd/agent-remote ./cmd/queue-tool

  macos-tests:
    name: macOS tests (${{ matrix.os }}, ${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        scope: [core-1, core-2, https, installer]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit, ownership, SQLite, real daemon, and HTTPS regressions
        run: bash scripts/test-go-runtime.sh '${{ matrix.scope }}'

  tooling-tests:
    name: Tooling tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Complete tooling and installer regression shard
        run: bash scripts/test-go-tooling.sh '${{ matrix.shard }}'

  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native regression tests
        run: bash scripts/test-native.sh
      - name: Menu-bar startup graphical regressions
        id: bootstrap-ui
        run: bash native/tests/run-bootstrap-ui-tests.sh "$RUNNER_TEMP/bootstrap-ui"
      - name: Retain menu-bar startup fixture evidence
        if: ${{ !cancelled() && steps.bootstrap-ui.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Menu-bar-startup-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bootstrap-ui/**/*.png
            ${{ runner.temp }}/bootstrap-ui/**/verification.json
          if-no-files-found: error
          retention-days: 14

  web-tests:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: go build -p 2 -trimpath -o build/queue-preview ./cmd/queue-preview
      - run: npm run test:web
      - run: npm run test:browser

  app:
    name: Universal app
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
      EXPECTED_XCODE_BUILD: 16F6
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS 15+ universal drag-and-drop app
        run: |
          scripts/apple-toolchain.sh "$RUNNER_TEMP/build-toolchain.json"
          scripts/build-app.sh
      - name: Retain credential-free build toolchain identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apple-build-toolchain-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-toolchain.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate immutable release manifest and Homebrew cask
        run: |
          go run -p 2 ./cmd/queue-tool render-cask \
            --archive "dist/Agent-Queue-$(cat VERSION)-universal.zip" \
            --version "$(cat VERSION)" --tag "build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" \
            --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --output dist
      - name: Record Homebrew version used for packaging validation
        run: brew --version
      - name: Verify Homebrew manifest and the actual app artifact
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
        run: go test -p 2 ./internal/tooling -run TestHomebrew -v
      - name: Verify the packaged app, queue and HTTPS runtime
        run: scripts/test-installer.sh "dist/Agent-Queue-$(cat VERSION)-universal.zip"
      - name: Verify the app on the mounted disk image
        run: bash scripts/test-dmg.sh "dist/Agent-Queue-$(cat VERSION)-universal.dmg"
      - name: Upload app and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent-Queue-App-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Record validated app artifact
        id: artifact-name
        run: printf 'name=Agent-Queue-App-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  ci-required:
    name: ci-required
    needs: [commit-policy, lint, vulnerability-check, macos-tests, tooling-tests, native-tests, web-tests, app]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if printf '%s' "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo 'All required validation jobs passed.'
          else
            echo 'Required validation jobs did not pass.' >&2
            exit 1
          fi
