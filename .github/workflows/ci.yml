name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify pre-push PR-range and fail-closed behavior
        run: go test -p 2 ./internal/tooling -run TestPrePush -v
      - name: Check DCO and verified signatures
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go run -p 2 ./cmd/queue-tool check-commits --base "$BASE_SHA" --head "$HEAD_SHA" --github-repository "$GITHUB_REPOSITORY"

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: brew install actionlint shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: npm ci
      - run: bash scripts/lint.sh

  vulnerability-check:
    name: Go vulnerability scan
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shipped CLI and HTTPS dependencies
        run: go run -p 2 golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/agent-heavy ./cmd/agent-remote

  macos-tests:
    name: macOS tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit, ownership, SQLite, real daemon, HTTPS, and installer regressions
        run: go test -p 2 -parallel 2 -race ./cmd/... ./internal/... ./packaging/homebrew ./remote/static -timeout 12m
      - name: Native regression tests
        run: bash scripts/test-native.sh

  web-tests:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: go build -p 2 -trimpath -o build/queue-preview ./cmd/queue-preview
      - run: npm run test:web
      - run: npm run test:browser

  installer:
    name: Universal installer
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS 15+ universal installer app
        run: scripts/build-installer.sh
      - name: Generate immutable release manifest and Homebrew cask
        run: |
          go run -p 2 ./cmd/queue-tool render-cask \
            --archive "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" \
            --version "$(cat VERSION)" --tag "build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" \
            --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --output dist
      - name: Record Homebrew version used for packaging validation
        run: brew --version
      - name: Verify Homebrew manifest and actual automated installer artifact
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
        run: go test -p 2 ./internal/tooling -run TestHomebrew -v
      - name: Verify payload and first install / upgrade behavior
        run: scripts/test-installer.sh "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip"
      - name: Verify signed installer on the mounted disk image
        run: bash scripts/test-dmg.sh "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.dmg"
      - name: Upload installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent-Job-Queue-Installer-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Record validated installer artifact
        id: artifact-name
        run: printf 'name=Agent-Job-Queue-Installer-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  ci-required:
    name: ci-required
    needs: [commit-policy, lint, vulnerability-check, macos-tests, web-tests, installer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if printf '%s' "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo 'All required validation jobs passed.'
          else
            echo 'Required validation jobs did not pass.' >&2
            exit 1
          fi

  notarize:
    name: Sign and notarize main installer
    needs: [ci-required, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment: apple-signing
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      NOTARY_TIMEOUT: ${{ vars.APPLE_NOTARY_TIMEOUT || '5m' }}
    outputs:
      team_id: ${{ steps.apple-team.outputs.team_id }}
      artifact_name: ${{ steps.final-artifact-name.outputs.name }}
    steps:
      - name: Record the expected public Apple team identifier
        id: apple-team
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          printf 'team_id=%s\n' "$APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore the latest checkpoint for this exact main build
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/macos-checkpoint.sh restore notarization-state
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.restore.outputs.restored == 'false'
        with:
          name: ${{ needs.installer.outputs.artifact_name }}
          path: validated-installer
      - name: Verify and extract the validated installer
        if: steps.restore.outputs.restored == 'false'
        run: |
          (cd validated-installer && shasum -a 256 -c ./*.zip.sha256)
          mkdir -p prepared-installer
          ditto -x -k "validated-installer/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" prepared-installer
          go run -p 2 ./cmd/queue-tool verify-installer --installer 'prepared-installer/Agent Job Queue Installer.app'
      - name: Initialize durable signing state
        if: steps.restore.outputs.restored == 'false'
        run: scripts/macos-resume.sh init 'prepared-installer/Agent Job Queue Installer.app' notarization-state "$(cat VERSION)"
      - name: Verify restored build identity and signed archives
        run: scripts/macos-resume.sh verify-state notarization-state "$(cat VERSION)"
      - name: Notarize the installed payload
        uses: ./.github/actions/notarization-stage
        with:
          stage: payload
          prepared-slot: '01'
          submitted-slot: '02'
          finished-slot: '03'
          certificate: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          notary-key: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      - name: Notarize the enclosing installer
        uses: ./.github/actions/notarization-stage
        with:
          stage: installer
          prepared-slot: '04'
          submitted-slot: '05'
          finished-slot: '06'
          certificate: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          notary-key: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      - name: Notarize the distribution disk image
        uses: ./.github/actions/notarization-stage
        with:
          stage: dmg
          prepared-slot: '07'
          submitted-slot: '08'
          finished-slot: '09'
          certificate: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          notary-key: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      - name: Export only completed notarized assets
        run: scripts/macos-resume.sh export notarization-state dist "$(cat VERSION)"
      - name: Generate final immutable manifest and Homebrew cask
        run: |
          go run -p 2 ./cmd/queue-tool render-cask \
            --archive "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" \
            --version "$(cat VERSION)" --tag "build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" \
            --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --output dist
      - name: Upload notarized installer and final checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent-Job-Queue-Notarized-Installer-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Record final artifact identity
        id: final-artifact-name
        run: printf 'name=Agent-Job-Queue-Notarized-Installer-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Explain retained state and safe recovery
        if: always()
        run: |
          {
            printf '### Apple notarization attempt %s\n\n' "$GITHUB_RUN_ATTEMPT"
            printf 'Checkpoints retain signed archives and public submission receipts for 30 days.\n\n'
            printf 'After a pending submission finishes, use **Re-run failed jobs** on this run.\n\n'
            printf 'CLI command: gh run rerun %s --failed --repo %s\n\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
            printf 'No pending or rejected artifact is published. Missing state or an uncertain upload stops recovery for manual reconciliation.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  notarized-tests:
    name: Notarized distribution (${{ matrix.os }})
    needs: [notarize]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact_name }}
          path: dist
      - name: Verify final checksums, signatures, tickets and production app copy
        env:
          APPLE_TEAM_ID: ${{ needs.notarize.outputs.team_id }}
        run: |
          (cd dist && shasum -a 256 -c ./*.sha256)
          scripts/test-notarized-installer.sh "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.dmg" "$APPLE_TEAM_ID"
      - name: Exercise the hardened packaged queue and HTTPS gateway
        run: scripts/test-installer.sh "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip"
      - name: Install through the real Homebrew DSL with quarantine retained
        env:
          APPLE_TEAM_ID: ${{ needs.notarize.outputs.team_id }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
        run: |
          mkdir prepared-signed-installer
          ditto -x -k "dist/Agent-Job-Queue-Installer-$(cat VERSION)-universal.zip" prepared-signed-installer
          export AGENT_QUEUE_TEST_NOTARIZED_PAYLOAD="$PWD/prepared-signed-installer/Agent Job Queue Installer.app/Contents/Resources/payload"
          go test -p 2 -parallel 2 ./internal/tooling -run '^TestNotarizedHomebrew' -count=1 -v -timeout 3m

  publish:
    name: Publish main installer
    needs: [notarize, notarized-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact_name }}
          path: dist
      - name: Publish immutable main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            trap 'rm -rf "$existing"' EXIT
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish > "$existing/release.json"
            for asset in dist/*; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "${asset##*/}" --dir "$existing"
            done
            go run -p 2 ./cmd/queue-tool verify-release --existing "$existing" --assets dist --commit "$GITHUB_SHA"
          else
            notes=$(mktemp)
            trap 'rm -f "$notes"' EXIT
            printf '%s\n\n%s\n' \
              "Automated installer from validated main commit ${GITHUB_SHA}. Includes Apple Silicon and Intel executables plus checksum-pinned Homebrew metadata." \
              'Signed with Apple Developer ID and notarized by Apple. The installer, installed menu app and DMG carry stapled tickets. Homebrew preserves quarantine. Standalone CLI first launch can require access to Apple notarization services.' > "$notes"
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Main build ${GITHUB_RUN_NUMBER}" --prerelease \
              --notes-file "$notes"
          fi

  homebrew-sync:
    name: Verify Homebrew delivery
    needs: [publish, notarize]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact_name }}
          path: dist
      - name: Require Homebrew dispatch configuration
        env:
          APP_CLIENT_ID: ${{ vars.HOMEBREW_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure HOMEBREW_SYNC_APP_CLIENT_ID and HOMEBREW_SYNC_APP_PRIVATE_KEY before Homebrew delivery. See docs/homebrew-delivery.md.'
            exit 1
          fi
      - name: Create token for the tap workflow only
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_SYNC_APP_PRIVATE_KEY }}
          owner: Dunky13
          repositories: homebrew-agent-job-queue
          permission-actions: write
      - name: Dispatch and verify the published Homebrew build
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          SOURCE_GH_TOKEN: ${{ github.token }}
        run: |
          go run -p 2 ./cmd/queue-delivery --manifest dist/agent-job-queue.json \
            --timeout 600 --poll-interval 5 | tee -a "$GITHUB_STEP_SUMMARY"
